<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bar chart of profit by flavor next to a line of margin percent by flavor, showing Strawberry highest profit but Peach highest margin">
<text x="20" y="20" font-size="9.5" font-weight="700" fill="#0E6F7E">profit ($)</text>
<text x="380" y="20" text-anchor="end" font-size="9.5" font-weight="700" fill="#6B4C9A">margin (%)</text>

<line x1="40" y1="180" x2="370" y2="180" stroke="#DED6C4" stroke-width="1.4"/>

<rect x="70" y="50" width="50" height="130" fill="#E3F1F3" stroke="#0E6F7E" stroke-width="1.6"/>
<text x="95" y="44" text-anchor="middle" font-size="10" font-weight="700" fill="#0E6F7E">$300</text>

<rect x="175" y="102" width="50" height="78" fill="#E3F1F3" stroke="#0E6F7E" stroke-width="1.6"/>
<text x="200" y="96" text-anchor="middle" font-size="10" font-weight="700" fill="#0E6F7E">$180</text>

<rect x="280" y="128" width="50" height="52" fill="#E3F1F3" stroke="#0E6F7E" stroke-width="1.6"/>
<text x="305" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#0E6F7E">$120</text>

<text x="95" y="196" text-anchor="middle" font-size="9.5" fill="#1C2B3A">Strawberry</text>
<text x="200" y="196" text-anchor="middle" font-size="9.5" fill="#1C2B3A">Blueberry</text>
<text x="305" y="196" text-anchor="middle" font-size="9.5" fill="#1C2B3A">Peach</text>

<path d="M95,92 L200,105 L305,72" fill="none" stroke="#6B4C9A" stroke-width="2.2"/>
<circle cx="95" cy="92" r="5" fill="#6B4C9A"/>
<text x="95" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#6B4C9A">60%</text>
<circle cx="200" cy="105" r="5" fill="#6B4C9A"/>
<text x="200" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="#6B4C9A">50%</text>
<circle cx="305" cy="72" r="6.5" fill="#6B4C9A" stroke="#fff" stroke-width="1.5"/>
<text x="305" y="60" text-anchor="middle" font-size="11" font-weight="800" fill="#6B4C9A">75%</text>

<text x="200" y="212" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1C2B3A">tallest bar and highest point aren't the same flavor</text>
</svg>
