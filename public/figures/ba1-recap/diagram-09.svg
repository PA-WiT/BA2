<svg viewBox="0 0 400 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Larger samples narrow the confidence interval around the same true value">
<line x1="200" y1="24" x2="200" y2="150" stroke="#1C2B3A" stroke-width="2" stroke-dasharray="5,4"/>
<text x="200" y="18" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1C2B3A">true value</text>
<line x1="60" y1="48" x2="340" y2="48" stroke="#0E6F7E" stroke-width="3"/>
<line x1="60" y1="41" x2="60" y2="55" stroke="#0E6F7E" stroke-width="3"/>
<line x1="340" y1="41" x2="340" y2="55" stroke="#0E6F7E" stroke-width="3"/>
<circle cx="200" cy="48" r="4.5" fill="#1C2B3A"/>
<text x="348" y="52" font-size="11.5" font-weight="700" fill="#55606E">n = 30</text>
<line x1="136" y1="84" x2="264" y2="84" stroke="#0E6F7E" stroke-width="3"/>
<line x1="136" y1="77" x2="136" y2="91" stroke="#0E6F7E" stroke-width="3"/>
<line x1="264" y1="77" x2="264" y2="91" stroke="#0E6F7E" stroke-width="3"/>
<circle cx="200" cy="84" r="4.5" fill="#1C2B3A"/>
<text x="272" y="88" font-size="11.5" font-weight="700" fill="#55606E">n = 300</text>
<line x1="174" y1="120" x2="226" y2="120" stroke="#0E6F7E" stroke-width="3"/>
<line x1="174" y1="113" x2="174" y2="127" stroke="#0E6F7E" stroke-width="3"/>
<line x1="226" y1="113" x2="226" y2="127" stroke="#0E6F7E" stroke-width="3"/>
<circle cx="200" cy="120" r="4.5" fill="#1C2B3A"/>
<text x="234" y="124" font-size="11.5" font-weight="700" fill="#55606E">n = 3,000</text>
<text x="200" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#1C2B3A">the centre doesn't move &#8212; the uncertainty shrinks</text>
</svg>
