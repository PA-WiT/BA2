<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four companies turning raw data into a business decision through the same pipeline">
<defs><marker id="q5" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#8A93A0"/></marker></defs>
<rect x="8" y="6" width="110" height="30" rx="6" fill="#E3F1F3" stroke="#0E6F7E" stroke-width="1.6"/>
<text x="63" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#0E6F7E">Raw data</text>
<line x1="118" y1="21" x2="146" y2="21" stroke="#8A93A0" stroke-width="1.6" marker-end="url(#q5)"/>
<rect x="146" y="6" width="110" height="30" rx="6" fill="#EFE9F7" stroke="#6B4C9A" stroke-width="1.6"/>
<text x="201" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#6B4C9A">Analysis</text>
<line x1="256" y1="21" x2="284" y2="21" stroke="#8A93A0" stroke-width="1.6" marker-end="url(#q5)"/>
<rect x="284" y="6" width="108" height="30" rx="6" fill="#FBF0D9" stroke="#9A6B00" stroke-width="1.6"/>
<text x="338" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#9A6B00">Decision</text>

<g font-size="10">
<line x1="8" y1="52" x2="392" y2="52" stroke="#DED6C4"/>
<text x="8" y="70" font-weight="700" fill="#1C2B3A">Amazon</text>
<text x="8" y="86" fill="#55606E">purchase &amp; search history</text>
<text x="8" y="102" fill="#55606E">&#8594; who buys what, together</text>
<text x="8" y="118" fill="#1C2B3A" font-weight="700">&#8594; product recommendations</text>

<line x1="8" y1="132" x2="392" y2="132" stroke="#DED6C4"/>
<text x="8" y="150" font-weight="700" fill="#1C2B3A">Netflix</text>
<text x="8" y="166" fill="#55606E">what you watch &amp; when you stop</text>
<text x="8" y="182" fill="#55606E">&#8594; predicted genre preference</text>
<text x="8" y="198" fill="#1C2B3A" font-weight="700">&#8594; what to show you next</text>

<line x1="200" y1="132" x2="200" y2="230" stroke="#DED6C4"/>
<text x="212" y="150" font-weight="700" fill="#1C2B3A">Uber</text>
<text x="212" y="166" fill="#55606E">live location &amp; traffic</text>
<text x="212" y="182" fill="#55606E">&#8594; predicted demand by area</text>
<text x="212" y="198" fill="#1C2B3A" font-weight="700">&#8594; real-time price &amp; routing</text>
</g>
<text x="200" y="240" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1C2B3A">same three boxes, every time</text>
</svg>
