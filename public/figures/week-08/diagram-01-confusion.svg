<svg viewBox="0 0 460 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A made-up sniff test for mould on 100 jam jars, later checked properly. Rows are the truth, columns are what the sniff test said. Of the 10 really mouldy jars, 8 were caught and 2 were missed. Of the 90 fine jars, 6 were false alarms and 84 passed. Accuracy 92 percent, caught 80 percent of the mouldy jars, and only 57 percent of the jars it called mouldy really were.">
<text x="300" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1C2B3A">What the sniff test said</text>
<text x="230" y="44" text-anchor="middle" font-size="11" font-weight="700" fill="#55606E">"Mouldy"</text>
<text x="370" y="44" text-anchor="middle" font-size="11" font-weight="700" fill="#55606E">"Fine"</text>
<text x="22" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#1C2B3A" transform="rotate(-90 22 140)">The truth</text>
<text x="150" y="92" text-anchor="end" font-size="11" font-weight="700" fill="#55606E">Really mouldy</text>
<text x="150" y="106" text-anchor="end" font-size="10" fill="#55606E">(10 jars)</text>
<text x="150" y="172" text-anchor="end" font-size="11" font-weight="700" fill="#55606E">Really fine</text>
<text x="150" y="186" text-anchor="end" font-size="10" fill="#55606E">(90 jars)</text>
<rect x="160" y="54" width="140" height="80" fill="#D7EFE3" stroke="#1C2B3A"/>
<rect x="300" y="54" width="140" height="80" fill="#F6D7D3" stroke="#1C2B3A"/>
<rect x="160" y="134" width="140" height="80" fill="#F6D7D3" stroke="#1C2B3A"/>
<rect x="300" y="134" width="140" height="80" fill="#D7EFE3" stroke="#1C2B3A"/>
<text x="230" y="90" text-anchor="middle" font-size="22" font-weight="700" fill="#1F6B45">8</text>
<text x="230" y="110" text-anchor="middle" font-size="10.5" fill="#1F6B45">caught</text>
<text x="370" y="90" text-anchor="middle" font-size="22" font-weight="700" fill="#A8322A">2</text>
<text x="370" y="110" text-anchor="middle" font-size="10.5" fill="#A8322A">missed: sold to customers!</text>
<text x="230" y="170" text-anchor="middle" font-size="22" font-weight="700" fill="#A8322A">6</text>
<text x="230" y="190" text-anchor="middle" font-size="10.5" fill="#A8322A">false alarm: good jar binned</text>
<text x="370" y="170" text-anchor="middle" font-size="22" font-weight="700" fill="#1F6B45">84</text>
<text x="370" y="190" text-anchor="middle" font-size="10.5" fill="#1F6B45">passed</text>
<text x="20" y="240" font-size="11" fill="#1C2B3A"><tspan font-weight="700">Right overall</tspan> (accuracy) = (8 + 84) / 100 = 92%</text>
<text x="20" y="260" font-size="11" fill="#1C2B3A"><tspan font-weight="700">Mouldy jars caught</tspan> (recall) = 8 / 10 = 80%</text>
<text x="20" y="280" font-size="11" fill="#1C2B3A"><tspan font-weight="700">"Mouldy" that really was</tspan> (precision) = 8 / (8 + 6) = 57%</text>
</svg>
