<svg viewBox="0 0 460 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The same two averages drawn twice: 55.4 jars without tasting and 64.9 with tasting. On the left the axis starts at 50, so the tasting bar looks about three times as tall. On the right the axis starts at zero, and the tasting bar is honestly about 17 percent taller.">
<text x="135" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1C2B3A">Axis starts at 50</text>
<line x1="45" y1="200" x2="225" y2="200" stroke="#1C2B3A"/><line x1="45" y1="50" x2="45" y2="200" stroke="#1C2B3A"/>
<text x="40" y="203.0" text-anchor="end" font-size="9.5" fill="#55606E">50</text><line x1="42" y1="200.0" x2="45" y2="200.0" stroke="#55606E"/>
<text x="40" y="165.5" text-anchor="end" font-size="9.5" fill="#55606E">54</text><line x1="42" y1="162.5" x2="45" y2="162.5" stroke="#55606E"/>
<text x="40" y="128.0" text-anchor="end" font-size="9.5" fill="#55606E">58</text><line x1="42" y1="125.0" x2="45" y2="125.0" stroke="#55606E"/>
<text x="40" y="90.5" text-anchor="end" font-size="9.5" fill="#55606E">62</text><line x1="42" y1="87.5" x2="45" y2="87.5" stroke="#55606E"/>
<text x="40" y="53.0" text-anchor="end" font-size="9.5" fill="#55606E">66</text><line x1="42" y1="50.0" x2="45" y2="50.0" stroke="#55606E"/>
<rect x="70" y="149.4" width="55" height="50.6" fill="#9AA5B1"/>
<text x="97.5" y="144.4" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1C2B3A">55.4</text>
<text x="97.5" y="214" text-anchor="middle" font-size="9.5" fill="#55606E">no tasting</text>
<rect x="150" y="60.3" width="55" height="139.7" fill="#C0602B"/>
<text x="177.5" y="55.3" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1C2B3A">64.9</text>
<text x="177.5" y="214" text-anchor="middle" font-size="9.5" fill="#55606E">tasting</text>
<text x="135" y="234" text-anchor="middle" font-size="10" font-weight="700" fill="#A8322A">looks almost 3× bigger: misleading</text>
<text x="365" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1C2B3A">Axis starts at 0</text>
<line x1="275" y1="200" x2="455" y2="200" stroke="#1C2B3A"/><line x1="275" y1="50" x2="275" y2="200" stroke="#1C2B3A"/>
<text x="270" y="203.0" text-anchor="end" font-size="9.5" fill="#55606E">0</text><line x1="272" y1="200.0" x2="275" y2="200.0" stroke="#55606E"/>
<text x="270" y="160.1" text-anchor="end" font-size="9.5" fill="#55606E">20</text><line x1="272" y1="157.1" x2="275" y2="157.1" stroke="#55606E"/>
<text x="270" y="117.3" text-anchor="end" font-size="9.5" fill="#55606E">40</text><line x1="272" y1="114.3" x2="275" y2="114.3" stroke="#55606E"/>
<text x="270" y="74.4" text-anchor="end" font-size="9.5" fill="#55606E">60</text><line x1="272" y1="71.4" x2="275" y2="71.4" stroke="#55606E"/>
<rect x="300" y="81.3" width="55" height="118.7" fill="#9AA5B1"/>
<text x="327.5" y="76.3" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1C2B3A">55.4</text>
<text x="327.5" y="214" text-anchor="middle" font-size="9.5" fill="#55606E">no tasting</text>
<rect x="380" y="60.9" width="55" height="139.1" fill="#C0602B"/>
<text x="407.5" y="55.9" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1C2B3A">64.9</text>
<text x="407.5" y="214" text-anchor="middle" font-size="9.5" fill="#55606E">tasting</text>
<text x="365" y="234" text-anchor="middle" font-size="10" font-weight="700" fill="#1F6B45">about 17% more: honest</text>
</svg>
