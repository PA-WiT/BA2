<svg viewBox="0 0 420 252" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The six-step Excel cleaning workflow: raw sheet, import, text and types, validate, duplicates and outliers, match, ending in a clean sheet of 23 rows and a change log">
<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#55606E"/></marker></defs>
<rect x="8" y="14" width="124" height="64" rx="5" fill="#FBF0D9" stroke="#9A6B00" stroke-width="1.4"/>
<text x="18" y="32" font-size="10.5" font-weight="800" fill="#9A6B00">01 Raw sheet</text>
<text x="18" y="48" font-size="8.8" fill="#1C2B3A">26 rows exactly as</text>
<text x="18" y="60" font-size="8.8" fill="#1C2B3A">exported. Never edited</text>
<rect x="148" y="14" width="124" height="64" rx="5" fill="#E3F1F3" stroke="#0E6F7E" stroke-width="1.4"/>
<text x="158" y="32" font-size="10.5" font-weight="800" fill="#0E6F7E">02 Import</text>
<text x="158" y="48" font-size="8.8" fill="#1C2B3A">delimiter, encoding,</text>
<text x="158" y="60" font-size="8.8" fill="#1C2B3A">column types</text>
<rect x="288" y="14" width="124" height="64" rx="5" fill="#E3F1F3" stroke="#0E6F7E" stroke-width="1.4"/>
<text x="298" y="32" font-size="10.5" font-weight="800" fill="#0E6F7E">03 Text, types</text>
<text x="298" y="48" font-size="8.8" fill="#1C2B3A">spaces, real numbers,</text>
<text x="298" y="60" font-size="8.8" fill="#1C2B3A">real dates</text>
<rect x="288" y="106" width="124" height="64" rx="5" fill="#E3F1F3" stroke="#0E6F7E" stroke-width="1.4"/>
<text x="298" y="124" font-size="10.5" font-weight="800" fill="#0E6F7E">04 Validate</text>
<text x="298" y="140" font-size="8.8" fill="#1C2B3A">rules, circle invalid,</text>
<text x="298" y="152" font-size="8.8" fill="#1C2B3A">fix and log each</text>
<rect x="148" y="106" width="124" height="64" rx="5" fill="#EFE9F7" stroke="#6B4C9A" stroke-width="1.4"/>
<text x="158" y="124" font-size="10.5" font-weight="800" fill="#6B4C9A">05 Copies, outliers</text>
<text x="158" y="140" font-size="8.8" fill="#1C2B3A">check first, then</text>
<text x="158" y="152" font-size="8.8" fill="#1C2B3A">decide what stays</text>
<rect x="8" y="106" width="124" height="64" rx="5" fill="#EFE9F7" stroke="#6B4C9A" stroke-width="1.4"/>
<text x="18" y="124" font-size="10.5" font-weight="800" fill="#6B4C9A">06 Match</text>
<text x="18" y="140" font-size="8.8" fill="#1C2B3A">lookups, then fuzzy</text>
<text x="18" y="152" font-size="8.8" fill="#1C2B3A">matches you review</text>
<rect x="8" y="198" width="404" height="46" rx="5" fill="#E4F2EA" stroke="#1F6B47" stroke-width="1.4"/>
<text x="18" y="217" font-size="10.5" font-weight="800" fill="#1F6B47">Clean sheet + change log</text>
<text x="18" y="233" font-size="8.8" fill="#1C2B3A">23 rows, 1,104 jars, 5,520.00 revenue. Every edit has a row, a reason and a before/after.</text>
<line x1="132" y1="46" x2="146" y2="46" stroke="#55606E" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="272" y1="46" x2="286" y2="46" stroke="#55606E" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="350" y1="78" x2="350" y2="104" stroke="#55606E" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="288" y1="138" x2="274" y2="138" stroke="#55606E" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="148" y1="138" x2="134" y2="138" stroke="#55606E" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="70" y1="170" x2="70" y2="196" stroke="#55606E" stroke-width="1.4" marker-end="url(#ar)"/>
</svg>
